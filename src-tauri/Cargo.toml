[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = { version = "0.36.0", features = ["rmcp"] }
tokio = { version = "1.41.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.13.3", features = ["json"] }
uuid = { version = "1.8", features = ["v4"] }
dotenv = "0.15.0"
rmcp = { version = "1.5.0", features = ["client", "macros", "client-side-sse", "reqwest", "transport-streamable-http-client-reqwest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"


