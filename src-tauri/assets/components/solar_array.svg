<svg viewBox="0 0 160 240" width="160" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#FFD700" stroke-width="2" filter="url(#glow)">
    <rect x="5" y="5" width="150" height="230" rx="5"/>
    <rect x="20" y="20" width="120" height="180" fill="rgba(255, 215, 0, 0.1)" />
    <!-- Grid lines -->
    <line x1="60" y1="20" x2="60" y2="200" opacity="0.7"/>
    <line x1="100" y1="20" x2="100" y2="200" opacity="0.7"/>
    <line x1="20" y1="50" x2="140" y2="50" opacity="0.7"/>
    <line x1="20" y1="80" x2="140" y2="80" opacity="0.7"/>
    <line x1="20" y1="110" x2="140" y2="110" opacity="0.7"/>
    <line x1="20" y1="140" x2="140" y2="140" opacity="0.7"/>
    <line x1="20" y1="170" x2="140" y2="170" opacity="0.7"/>
    <text x="80" y="225" fill="#FFD700" stroke="none" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SOLAR ARRAY</text>
  </g>
</svg>
