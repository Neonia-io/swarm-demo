<svg viewBox="0 0 240 160" width="240" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#1E90FF" stroke-width="2" filter="url(#glow)">
    <rect x="5" y="5" width="230" height="150" rx="5"/>
    <rect x="20" y="20" width="60" height="100" fill="rgba(30, 144, 255, 0.2)" />
    <rect x="90" y="20" width="60" height="100" fill="rgba(30, 144, 255, 0.4)" />
    <rect x="160" y="20" width="60" height="100" fill="rgba(30, 144, 255, 0.1)" />
    <line x1="20" y1="70" x2="80" y2="70" />
    <line x1="90" y1="70" x2="150" y2="70" />
    <line x1="160" y1="70" x2="220" y2="70" />
    <text x="120" y="145" fill="#1E90FF" stroke="none" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">WAREHOUSE</text>
  </g>
</svg>
